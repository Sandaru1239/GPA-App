<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPA Ledger — 3-Year CS Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div>
        <h1>GPA Ledger</h1>
        <div class="subtitle">B.Sc. Computer Science · Year 1–3</div>
      </div>
      <div class="masthead-right">
        <span id="saved-stamp">not saved yet</span>
        <button id="reset-btn" class="reset-btn">Clear all grades</button>
      </div>
    </header>

    <section class="summary">
      <div class="gauge-wrap">
        <svg viewBox="0 0 130 130">
          <circle class="gauge-track" cx="65" cy="65" r="54"></circle>
          <circle id="gauge-arc" class="gauge-arc" cx="65" cy="65" r="54"></circle>
        </svg>
        <div class="gauge-center">
          <span id="cgpa-value">—</span>
          <span class="gauge-label">CGPA</span>
        </div>
      </div>
      <div class="summary-details">
        <h2>Overall standing</h2>
        <span id="cgpa-class">—</span>
        <span id="progress-text">0 / 0 modules graded</span>
        <div class="progress-track"><div id="progress-fill"></div></div>
      </div>
    </section>

    <nav id="year-tabs"></nav>
    <div id="year-panel"></div>

    <footer class="note">
      Grades are saved automatically in this browser (local storage) — nothing leaves your device.
    </footer>
  </div>

  <script src="js/subjects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
